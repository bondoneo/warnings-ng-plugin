name: "CodeQL"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "32 3 * * 0"

jobs:
  analyze:
    name: Analyze code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ java ]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Build with Maven
        run: mvn -V --color always -ntp clean verify -Pskip -Dtest=BuildResultStubs,CompositeBuildResultTest,HealthSeriesBuilderTest,HealthTrendChartTest,NewVersusFixedPieChartTest,NewVersusFixedSeriesBuilderTest,NewVersusFixedTrendChartTest,SeverityPieChartTest,SeveritySeriesBuilderTest,SeverityTrendChartTest,ToolsTrendChartTest,IssuesTotalColumnTest,WarningsAppearanceConfigurationTest,RegexpFilterTest,WarningsMcpServerExtensionTest,AbstractDetailsModelTest,AggregationActionTest,AnalysisHistoryTest,AnalysisResultTest,BlamesModelTest,ByIdResultSelectorTest,ConsoleDetailTest,DeltaReportTest,DetailFactorySourceFileITest,DetailFactoryTest,DetailsTableModelTest,FileNameRendererTest,FixedWarningsDetailTest,ForensicsModelTest,HealthDescriptorTest,HealthReportBuilderTest,IconLabelProviderTest,IssuesModelTest,JobActionTest,LabelProviderFactoryITest,PropertyStatisticsTest,ReportLocationsTest,ReportScanningToolITest,ReportScanningToolStubForTesting,ReportXmlStreamTest,ResetQualityGateCommandITest,ResetQualityGateCommandTest,ResetReferenceActionTest,ResultActionTest,RunTabTest,StaticAnalysisLabelProviderTest,SummaryModelTest,TabLabelProviderTest,ToolNameRegistryTest,ToolSelectionDescriptorTest,WidgetTest,IssuesTablePortletTest,AnalysisStepDescriptorTest,AnnotatedReportTest,IssuesAggregatorTest,MatrixBridgeTest,WarningChecksPublisherITest,Assertions,CategoryDatasetAssertions,FormValidationAssert,IntegrationTestWithJenkinsPerSuite,IntegrationTestWithJenkinsPerTest,IssuesDetailAssert,JobStubs,LocalizedMessagesTest,WarningsIntegrationTest,IssuesSizeTokenMacroTest,AbsolutePathGeneratorITest,AffectedFilesResolverTest,BlameTest,BuildResultNavigatorTest,IssuesStatisticsTest,LocalizedSeverityTest,ModelValidationTest,QualityGateEvaluatorTest,QualityGateTest,DryTableModelTest,DryThresholdValidationTest,RegisteredParserTest,RevApiModelTest,ToolsLister,AxivionParserTest,AxivionSuiteDescriptorTest,AxivionSuiteSerializationTest,AxivionSuiteTest,TestDashboard,DynamicDocumentParserTest,DynamicLineParserTest,GroovyExpressionMatcherTest,GroovyParserTest,GroovyScriptITest,ParserConfigurationITest,ParserConfigurationTest,ConfigurationAsCodeITest,FlexiblePublishITest,JobDslITest,TimeStamperPluginITest,TokenMacroITest,AffectedFilesResolverITest,DockerContainerITest,DryITest,FilesScannerITest,FiltersITest,GitForensicsITest,HealthReportITest,JobActionITest,MatrixJobITest,MavenIssuesRecorderITest,MiscIssuesRecorderITest,ModuleDetectorITest,PackageDetectorsITest,ParsersITest,PropertyRow,QualityGateITest,ReferenceFinderITest,RemoteApiITest,StepsITest,StepsOnAgentITest,AgentScannerTest,TaskScannerBenchmark,TaskScannerTest,PackageArchitectureTest,PluginArchitectureTest,ArchitectureTest,DashboardViewPortletUiTest,DetailsTabUiTest,FreeStyleConfigurationUiTest,GitForensicsUiTest,GlobalConfigurationUiTest,IssuesColumnUiTest,SmokeTests,SnippetGeneratorUiTest,TrendChartsUiTest,UiTest,WarningsPluginUiTest

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: sarif-results
          category: "/language:${{ matrix.language }}"

      - name: Filter SARIF results
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -**/*Assert*
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
